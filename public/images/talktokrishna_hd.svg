<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12204a"/>
      <stop offset="60%" stop-color="#1f3f8f"/>
      <stop offset="100%" stop-color="#d9822b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5b85a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5b85a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ea"/>
      <stop offset="100%" stop-color="#f6e7cf"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1130" cy="500" r="430" fill="url(#glow)"/>

  <!-- soft rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <circle cx="1130" cy="500" r="300"/>
    <circle cx="1130" cy="500" r="380"/>
    <circle cx="1130" cy="500" r="460"/>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="130" y="430" font-size="92">Talk to Krishna</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="134" y="495" font-size="30" fill="#f3e6d2">Guidance from the Bhagavad Gita,</text>
    <text x="134" y="538" font-size="30" fill="#f3e6d2">by voice or text.</text>

    <g transform="translate(134,600)" font-size="22" fill="#ffffff">
      <rect width="170" height="48" rx="24" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="85" y="31" text-anchor="middle">Android · iOS</text>
      <rect x="186" width="170" height="48" rx="24" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="271" y="31" text-anchor="middle">7 languages</text>
      <rect x="372" width="190" height="48" rx="24" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="467" y="31" text-anchor="middle">Music therapy</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(980,130)">
    <rect width="300" height="740" rx="48" fill="#0d1530"/>
    <rect x="14" y="14" width="272" height="712" rx="36" fill="url(#screen)"/>
    <rect x="110" y="28" width="80" height="18" rx="9" fill="#0d1530"/>

    <g font-family="Inter, Arial, sans-serif">
      <text x="150" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#12204a">Talk to Krishna</text>
      <line x1="34" y1="116" x2="266" y2="116" stroke="#12204a" stroke-opacity="0.1"/>

      <!-- user question -->
      <rect x="96" y="146" width="170" height="74" rx="18" fill="#1f3f8f"/>
      <text x="112" y="177" font-size="15" fill="#ffffff">How do I stop</text>
      <text x="112" y="200" font-size="15" fill="#ffffff">worrying about results?</text>

      <!-- answer -->
      <rect x="34" y="244" width="206" height="176" rx="18" fill="#ffffff" stroke="#e8d6b8"/>
      <text x="50" y="276" font-size="15" fill="#2a2620">Do your duty with full</text>
      <text x="50" y="299" font-size="15" fill="#2a2620">attention, and let go</text>
      <text x="50" y="322" font-size="15" fill="#2a2620">of the outcome.</text>
      <text x="50" y="360" font-size="13" fill="#b5651d">Bhagavad Gita 2.47</text>
      <rect x="50" y="378" width="120" height="6" rx="3" fill="#e8d6b8"/>
      <rect x="50" y="392" width="90" height="6" rx="3" fill="#e8d6b8"/>

      <!-- music card -->
      <rect x="34" y="452" width="232" height="96" rx="18" fill="#12204a"/>
      <circle cx="78" cy="500" r="24" fill="#d9822b"/>
      <path d="M71 488 L71 512 L90 500 Z" fill="#ffffff"/>
      <text x="116" y="494" font-size="15" font-weight="700" fill="#ffffff">Music therapy</text>
      <text x="116" y="516" font-size="13" fill="#c9d3ee">Calm mind · 12 min</text>

      <!-- input bar with mic -->
      <rect x="34" y="640" width="180" height="52" rx="26" fill="#ffffff" stroke="#e8d6b8"/>
      <text x="58" y="672" font-size="15" fill="#9a9184">Ask anything…</text>
      <circle cx="240" cy="666" r="26" fill="#d9822b"/>
      <rect x="234" y="652" width="12" height="20" rx="6" fill="#ffffff"/>
      <path d="M229 666 a11 11 0 0 0 22 0" stroke="#ffffff" stroke-width="2.5" fill="none"/>
      <line x1="240" y1="677" x2="240" y2="684" stroke="#ffffff" stroke-width="2.5"/>
    </g>
  </g>
</svg>
