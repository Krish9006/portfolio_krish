<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0ea5a3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- soft abstract nodes -->
  <g fill="rgba(255,255,255,0.06)" filter="url(#f1)">
    <circle cx="420" cy="320" r="220"/>
    <circle cx="1500" cy="260" r="180"/>
    <circle cx="1200" cy="720" r="260"/>
    <circle cx="380" cy="820" r="160"/>
  </g>

  <!-- network lines -->
  <g stroke="#fff" stroke-opacity="0.18" stroke-width="2" fill="none">
    <path d="M480 300 C640 220, 820 260, 980 300" />
    <path d="M520 700 C700 620, 920 660, 1140 720" />
    <path d="M1400 300 C1320 420, 1260 540, 1200 680" />
    <path d="M360 760 C540 700, 760 740, 980 780" />
  </g>

  <!-- nodes with glow -->
  <g>
    <circle cx="980" cy="300" r="8" fill="#fff" opacity="0.95" />
    <circle cx="1140" cy="720" r="8" fill="#fff" opacity="0.95" />
    <circle cx="420" cy="320" r="8" fill="#fff" opacity="0.95" />
    <circle cx="380" cy="820" r="8" fill="#fff" opacity="0.95" />
  </g>

  <!-- stylized brain / circuit shape -->
  <g transform="translate(520,200) scale(1.1)">
    <path d="M280 80 C320 20, 420 10, 480 70 C540 130, 520 240, 460 280 C400 320, 320 300, 280 260 C240 220, 220 140, 280 80 Z"
          fill="#0b1220" fill-opacity="0.12"/>
    <path d="M300 110 C340 60, 400 60, 440 100" stroke="#fff" stroke-opacity="0.12" stroke-width="2" fill="none"/>
    <path d="M320 160 C360 140, 400 160, 440 200" stroke="#fff" stroke-opacity="0.1" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Title and subtitle -->
  <g transform="translate(160,720)">
    <rect x="0" y="-40" width="880" height="200" fill="none" />
    <text x="0" y="0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">ContentBrain AI</text>
    <text x="0" y="46" fill="#e6fdfb" font-family="Inter, Arial, sans-serif" font-size="22">RAG-powered strategic content assistant — real-time document search, ideation, and CTA automation</text>
  </g>

  <!-- subtle attribution (optional) -->
  <text x="1720" y="1040" fill="#ffffff" fill-opacity="0.06" font-family="Inter, Arial, sans-serif" font-size="12">Generated SVG banner</text>
</svg>
